<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>智能默写工具</title>
<style>
*{box-sizing:border-box;font-family:system-ui,-apple-system,Segoe UI,Roboto}
body{margin:0;padding:16px;background:#f6f7f9;color:#222}
.container{max-width:700px;margin:0 auto;background:white;padding:20px;border-radius:12px;box-shadow:0 2px 10px #0001}
h1{margin-top:0;font-size:22px}
.section{margin:14px 0}
label{display:block;margin-bottom:4px;font-weight:500}
textarea,input,select{width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;font-size:16px}
button{padding:12px 16px;background:#007bff;color:white;border:none;border-radius:8px;font-size:16px;margin-top:8px;cursor:pointer}
button.gray{background:#6c757d}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.controls button{flex:1}
.status{margin-top:12px;color:#007bff;font-size:15px}
</style>
</head>
<body>
<div class="container">
<h1>智能默写工具（粤/普/英）</h1>

<div class="section">
<label>朗读模式</label>
<select id="langMode">
<option value="zh">中文（普通话）</option>
<option value="yue">粤语</option>
<option value="en">英文</option>
</select>
</div>

<div class="section">
<label>默写类型</label>
<select id="typeMode">
<option value="word">词语模式</option>
<option value="para">段落模式</option>
</select>
</div>

<div class="section">
<label>内容（一行一个）</label>
<textarea id="content" rows="6" placeholder="词语：一行一个
段落：直接粘贴，会按字数分段"></textarea>
</div>

<div class="section">
<label>重复次数</label>
<input type="number" id="repeat" value="3" min="1">
</div>

<div class="section">
<label>间隔秒数</label>
<input type="number" id="delay" value="5" min="1">
</div>

<div class="section" id="paraSetting" style="display:none">
<label>段落每多少字停顿</label>
<input type="number" id="splitLen" value="10" min="1">
</div>

<div class="controls">
<button id="start">开始默写</button>
<button id="stop" class="gray">停止</button>
</div>

<div class="status" id="status"></div>
</div>

<script>
const u = new SpeechSynthesisUtterance();
let t = null, running = false;

function setStatus(s){document.getElementById('status').textContent = s}

function sleep(s){return new Promise(r=>setTimeout(r,s*1000))}

function getVoice(lang){
  const vs = speechSynthesis.getVoices();
  if(lang==='yue') return vs.find(v=>v.name.includes('Cantonese')||v.lang.includes('yue'))||vs.find(v=>v.lang.includes('zh'));
  if(lang==='zh') return vs.find(v=>v.lang.includes('zh-CN'));
  return vs.find(v=>v.lang.includes('en')) || vs[0];
}

async function speak(text){
  return new Promise(res=>{
    u.text = text;
    u.voice = getVoice(document.getElementById('langMode').value);
    u.rate = 0.95;
    u.onend = res;
    speechSynthesis.speak(u);
  })
}

function splitPara(s,len){
  const arr=[];
  for(let i=0;i<s.length;i+=len) arr.push(s.slice(i,i+len));
  return arr;
}

document.getElementById('typeMode').addEventListener('change',()=>{
  const m = document.getElementById('typeMode').value;
  document.getElementById('paraSetting').style.display = m==='para'?'block':'none';
});

document.getElementById('stop').onclick=()=>{
  running=false;
  speechSynthesis.cancel();
  if(t)clearTimeout(t);
  setStatus('已停止');
}

document.getElementById('start').onclick=async()=>{
  if(running)return;
  running=true;
  setStatus('准备中…');
  await sleep(0.5);

  const mode = document.getElementById('typeMode').value;
  const lines = document.getElementById('content').value.split(/\n+/).map(x=>x.trim()).filter(x=>x);
  const rpt = Number(document.getElementById('repeat').value);
  const dly = Number(document.getElementById('delay').value);
  const split = Number(document.getElementById('splitLen').value);

  for(const line of lines){
    if(!running)break;
    let parts = mode==='word' ? [line] : splitPara(line,split);

    for(const p of parts){
      if(!running)break;
      if(!p)continue;
      for(let i=0;i<rpt;i++){
        if(!running)break;
        setStatus(`朗读：${p}`);
        await speak(p);
        if(i!==rpt-1)await sleep(dly);
      }
      await sleep(dly);
    }
  }
  if(running)setStatus('本轮默写完成');
  running=false;
}

speechSynthesis.onvoiceschanged=()=>{};
</script>
</body>
</html>
