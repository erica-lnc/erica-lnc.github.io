<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NFC空氣質量分析儀【科普演示】</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif;}
body{background:#0b1322;color:#fff;min-height:100vh;padding:40px 16px;}
.box{max-width:400px;margin:0 auto;background:rgba(255,255,255,0.07);border-radius:20px;padding:28px 22px;border:1px solid rgba(255,255,255,0.12);}
.title{text-align:center;font-size:21px;margin-bottom:22px;}
.tip{background:rgba(40,120,220,0.15);padding:12px;border-radius:10px;font-size:14px;margin-bottom:24px;color:#b8daff;}
.status{text-align:center;margin-bottom:20px;font-size:16px;min-height:44px;}
.err{color:#ff7b7b;}
.ok{color:#7bff9e;}
.loadingDot span{display:inline-block;width:8px;height:8px;border-radius:50%;background:#42a5f5;margin:0 4px;animation:dot 1.2s infinite;}
.loadingDot span:nth-child(2){animation-delay:0.2s;}
.loadingDot span:nth-child(3){animation-delay:0.4s;}
@keyframes dot{0%,100%{opacity:0.2;transform:scale(0.8);}50%{opacity:1;transform:scale(1.1);}}
.item{display:flex;justify-content:space-between;padding:14px 10px;background:rgba(255,255,255,0.05);border-radius:10px;margin-bottom:10px;}
.val{font-weight:bold;font-size:19px;color:#73ccff;}
.level{font-size:13px;margin-left:8px;}
.level-good{color:#7bff9e;}
.level-warn{color:#ffcc4d;}
.level-bad{color:#ff7b7b;}
.info{margin-top:18px;font-size:12px;color:#aaa;text-align:center;}
.hide{display:none;}
#startBtn{width:100%;padding:14px;background:#2878dc;color:white;border:none;border-radius:12px;font-size:16px;margin-bottom:20px;cursor:pointer;}
#startBtn:disabled{opacity:0.5;cursor:not-allowed;}
</style>
</head>
<body>
<div class="box">
<h2 class="title">🔬 NFC空氣檢測終端</h2>
<div class="tip">點擊按鈕啟動，將寫入金鑰的NFC標籤貼近手機NFC區域</div>
<button id="startBtn">啟動NFC掃描</button>
<div class="status" id="statusText">未啟動掃描</div>
<div class="loadingDot hide" id="loadAnim">
<span></span><span></span><span></span>
</div>
<div id="resultArea" class="hide">
<div class="item">
    <span>甲醛 HCHO</span>
    <span><span class="val" id="hchoOut">0.00 mg/m³</span><span class="level" id="hchoLevel"></span></span>
</div>
<div class="item">
    <span>TVOC</span>
    <span><span class="val" id="tvocOut">0.00 mg/m³</span><span class="level" id="tvocLevel"></span></span>
</div>
</div>
<div class="info">⚠️ 本頁面僅技術演示，無真實檢測能力</div>
</div>

<script>
const KEY_WHITELIST = [
    "SK-AIR-DET-KEY-9827461acf03bd7e228109ff55aa77bbccdd88eeff0011",
    "SK-AIR-DET-KEY-8736250bda92ce6f117208ee44bb66aaee99ddcc0022",
    "SK-AIR-DET-KEY-7625149cbe81df5e339217dd33cc55bbdd88aaff0033"
];

const statusText = document.getElementById("statusText");
const loadAnim = document.getElementById("loadAnim");
const resultArea = document.getElementById("resultArea");
const startBtn = document.getElementById("startBtn");

let isScanning = false;

startBtn.addEventListener("click", async () => {
    if (isScanning) return;

    if (!("NDEFReader" in window)) {
        statusText.className = "status err";
        statusText.innerText = "此瀏覽器不支援 Web NFC，請使用 Android Chrome";
        return;
    }

    try {
        isScanning = true;
        startBtn.disabled = true;
        startBtn.textContent = "掃描中...";

        const ndef = new NDEFReader();
        await ndef.scan();
        statusText.className = "status ok";
        statusText.innerText = "掃描已開啟，請貼近NFC標籤";

        ndef.onreading = event => {
            loadAnim.classList.add("hide");
            resultArea.classList.add("hide");

            const msg = event.message;
            if (!msg || msg.records.length === 0) {
                statusText.className = "status err";
                statusText.innerText = "請使用官方檢測芯片，此為非官方芯片";
                resetBtn();
                return;
            }

            const record = msg.records[0];
            if (record.type !== "T") {
                statusText.className = "status err";
                statusText.innerText = "請使用官方檢測芯片，此為非官方芯片";
                resetBtn();
                return;
            }

            // 正確解碼 NDEF Text Record
            const payload = record.payload;
            const langCodeLen = payload[0];
            const textBytes = payload.slice(1 + langCodeLen);
            const tagKey = new TextDecoder("utf-8").decode(textBytes).trim();

            if (!KEY_WHITELIST.includes(tagKey)) {
                statusText.className = "status err";
                statusText.innerText = "請使用官方檢測芯片，此為非官方芯片";
                resetBtn();
                return;
            }

            // 金鑰校驗通過
            statusText.className = "status ok";
            statusText.innerText = "識別成功，正在採集空氣樣本";
            loadAnim.classList.remove("hide");

            setTimeout(() => {
                const hcho = (Math.random() * 0.20).toFixed(2);
                const tvoc = (Math.random() * 0.75).toFixed(2);

                document.getElementById("hchoOut").textContent = `${hcho} mg/m³`;
                document.getElementById("tvocOut").textContent = `${tvoc} mg/m³`;

                // 評級顯示
                const hchoLevel = document.getElementById("hchoLevel");
                const tvocLevel = document.getElementById("tvocLevel");
                hchoLevel.textContent = hcho > 0.10 ? "⚠️ 超標" : "✅ 正常";
                hchoLevel.className = "level " + (hcho > 0.10 ? "level-bad" : "level-good");
                tvocLevel.textContent = tvoc > 0.60 ? "⚠️ 偏高" : "✅ 正常";
                tvocLevel.className = "level " + (tvoc > 0.60 ? "level-warn" : "level-good");

                loadAnim.classList.add("hide");
                statusText.innerText = "檢測完成";
                resultArea.classList.remove("hide");
                resetBtn();
            }, 3000);
        };

        ndef.onreadingerror = () => {
            statusText.className = "status err";
            statusText.innerText = "標籤讀取失敗，請重新貼緊";
            resetBtn();
        };

    } catch (err) {
        statusText.className = "status err";
        statusText.innerText = "啟動失敗: " + err.message;
        resetBtn();
    }
});

function resetBtn() {
    isScanning = false;
    startBtn.disabled = false;
    startBtn.textContent = "啟動NFC掃描";
}
</script>
</body>
</html>
