<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>空氣質量檢測儀 - 專業版</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 20px;
    color: #fff;
  }
  .container {
    max-width: 420px;
    width: 100%;
  }
  .header {
    text-align: center;
    padding: 24px 0 16px;
  }
  .header h1 {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 2px;
  }
  .header p {
    font-size: 13px;
    color: #8ecae6;
    margin-top: 4px;
  }
  .card {
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(12px);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 16px;
    border: 1px solid rgba(255,255,255,0.12);
  }
  .tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  .tab {
    flex: 1;
    padding: 10px 0;
    text-align: center;
    border-radius: 10px;
    font-size: 14px;
    cursor: pointer;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    transition: all 0.3s;
  }
  .tab.active {
    background: linear-gradient(135deg, #2193b0, #6dd5ed);
    color: #fff;
    border-color: transparent;
    font-weight: 600;
  }
  .status-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px;
    background: rgba(0,0,0,0.2);
    border-radius: 10px;
    margin-bottom: 16px;
  }
  .status-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: #555;
    transition: background 0.3s;
  }
  .status-dot.scanning { background: #ffd166; animation: pulse 0.8s infinite; }
  .status-dot.done { background: #06d6a0; }
  @keyframes pulse {
    0%,100% { opacity: 1; }
    50% { opacity: 0.4; }
  }
  .status-text { font-size: 14px; }
  .result-area {
    text-align: center;
    padding: 20px 0;
    min-height: 160px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
  }
  .result-value {
    font-size: 52px;
    font-weight: 700;
    line-height: 1;
  }
  .result-unit {
    font-size: 16px;
    color: #aaa;
    margin-top: 6px;
  }
  .result-level {
    margin-top: 10px;
    padding: 4px 16px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
  }
  .level-safe { background: rgba(6,214,160,0.2); color: #06d6a0; }
  .level-warning { background: rgba(255,209,102,0.2); color: #ffd166; }
  .level-danger { background: rgba(239,71,111,0.2); color: #ef476f; }
  .btn {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    background: linear-gradient(135deg, #2193b0, #6dd5ed);
    color: #fff;
    transition: transform 0.2s;
  }
  .btn:active { transform: scale(0.97); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .history { margin-top: 16px; }
  .history h3 { font-size: 14px; margin-bottom: 10px; color: #8ecae6; }
  .history-item {
    display: flex;
    justify-content: space-between;
    padding: 10px 12px;
    background: rgba(0,0,0,0.15);
    border-radius: 8px;
    margin-bottom: 6px;
    font-size: 13px;
  }
  .disclaimer {
    margin-top: 20px;
    padding: 14px;
    background: rgba(239,71,111,0.15);
    border: 1px solid rgba(239,71,111,0.4);
    border-radius: 12px;
    text-align: center;
    font-size: 13px;
    line-height: 1.6;
    color: #ff8fa3;
  }
  .disclaimer strong { color: #ef476f; font-size: 14px; }
  .progress-bar {
    width: 100%;
    height: 6px;
    background: rgba(255,255,255,0.1);
    border-radius: 3px;
    margin-top: 12px;
    overflow: hidden;
    display: none;
  }
  .progress-bar.show { display: block; }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #2193b0, #6dd5ed);
    width: 0%;
    transition: width 0.1s linear;
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>🔬 空氣質量檢測儀</h1>
    <p>NFC 智能傳感 · 實時監測</p>
  </div>

  <div class="card">
    <div class="tabs">
      <div class="tab active" data-mode="formaldehyde">甲醛檢測</div>
      <div class="tab" data-mode="radiation">輻射檢測</div>
      <div class="tab" data-mode="water">水質檢測</div>
    </div>

    <div class="status-bar">
      <div class="status-dot" id="statusDot"></div>
      <span class="status-text" id="statusText">請將設備貼近手機 NFC 區域</span>
    </div>

    <div class="result-area" id="resultArea">
      <div style="font-size:40px; opacity:0.3;">📡</div>
      <p style="margin-top:10px; color:#888; font-size:14px;">等待檢測...</p>
    </div>

    <div class="progress-bar" id="progressBar">
      <div class="progress-fill" id="progressFill"></div>
    </div>

    <button class="btn" id="detectBtn" onclick="startDetect()">開始檢測</button>
  </div>

  <div class="card history" id="historyCard" style="display:none;">
    <h3>📋 檢測記錄</h3>
    <div id="historyList"></div>
  </div>

  <div class="disclaimer">
    <strong>⚠️ 科普演示頁面</strong><br>
    本頁面所有數據均為隨機生成，無任何真實傳感器或檢測能力。<br>
    僅用於展示「假檢測儀」的運作原理，請勿當真。
  </div>
</div>

<script>
const MODES = {
  formaldehyde: {
    label: '甲醛',
    unit: 'mg/m³',
    min: 0.01, max: 0.35,
    safe: 0.08, warning: 0.15,
    levels: [
      { max: 0.08, text: '✅ 安全', cls: 'level-safe' },
      { max: 0.15, text: '⚠️ 輕度超標', cls: 'level-warning' },
      { max: 999, text: '❌ 重度超標', cls: 'level-danger' }
    ]
  },
  radiation: {
    label: '輻射',
    unit: 'μSv/h',
    min: 0.05, max: 1.2,
    safe: 0.3, warning: 0.6,
    levels: [
      { max: 0.3, text: '✅ 正常本底', cls: 'level-safe' },
      { max: 0.6, text: '⚠️ 偏高', cls: 'level-warning' },
      { max: 999, text: '❌ 危險', cls: 'level-danger' }
    ]
  },
  water: {
    label: '水質 TDS',
    unit: 'ppm',
    min: 20, max: 500,
    safe: 150, warning: 300,
    levels: [
      { max: 150, text: '✅ 優良', cls: 'level-safe' },
      { max: 300, text: '⚠️ 一般', cls: 'level-warning' },
      { max: 999, text: '❌ 不合格', cls: 'level-danger' }
    ]
  }
};

let currentMode = 'formaldehyde';
let history = [];

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentMode = tab.dataset.mode;
    resetUI();
  });
});

function resetUI() {
  document.getElementById('statusDot').className = 'status-dot';
  document.getElementById('statusText').textContent = '請將設備貼近手機 NFC 區域';
  document.getElementById('resultArea').innerHTML = '<div style="font-size:40px; opacity:0.3;">📡</div><p style="margin-top:10px; color:#888; font-size:14px;">等待檢測...</p>';
  document.getElementById('progressBar').classList.remove('show');
  document.getElementById('detectBtn').disabled = false;
}

function startDetect() {
  const mode = MODES[currentMode];
  const btn = document.getElementById('detectBtn');
  const dot = document.getElementById('statusDot');
  const text = document.getElementById('statusText');
  const bar = document.getElementById('progressBar');
  const fill = document.getElementById('progressFill');
  const result = document.getElementById('resultArea');

  btn.disabled = true;
  dot.className = 'status-dot scanning';
  text.textContent = '正在採集空氣樣本...';
  bar.classList.add('show');
  result.innerHTML = '<div style="font-size:40px; animation: pulse 0.8s infinite;">⏳</div><p style="margin-top:10px; color:#aaa; font-size:14px;">分析中，請稍候...</p>';

  let progress = 0;
  const interval = setInterval(() => {
    progress += Math.random() * 15;
    if (progress > 100) progress = 100;
    fill.style.width = progress + '%';

    if (progress >= 100) {
      clearInterval(interval);
      setTimeout(() => showResult(mode), 400);
    }
  }, 200);
}

function showResult(mode) {
  const value = (mode.min + Math.random() * (mode.max - mode.min));
  const display = mode.unit === 'mg/m³' ? value.toFixed(2) : Math.round(value);
  const level = mode.levels.find(l => value <= l.max);

  document.getElementById('statusDot').className = 'status-dot done';
  document.getElementById('statusText').textContent = '檢測完成';
  document.getElementById('progressBar').classList.remove('show');
  document.getElementById('detectBtn').disabled = false;

  document.getElementById('resultArea').innerHTML = `
    <div class="result-value">${display}</div>
    <div class="result-unit">${mode.label} · ${mode.unit}</div>
    <div class="result-level ${level.cls}">${level.text}</div>
  `;

  const now = new Date();
  const time = `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}:${now.getSeconds().toString().padStart(2,'0')}`;
  history.unshift({ mode: mode.label, value: display, unit: mode.unit, level: level.text, time });
  if (history.length > 5) history.pop();
  renderHistory();
}

function renderHistory() {
  const card = document.getElementById('historyCard');
  const list = document.getElementById('historyList');
  card.style.display = 'block';
  list.innerHTML = history.map(h =>
    `<div class="history-item">
      <span>${h.time} ${h.mode}</span>
      <span>${h.value} ${h.unit} ${h.level}</span>
    </div>`
  ).join('');
}
</script>
</body>
</html>
