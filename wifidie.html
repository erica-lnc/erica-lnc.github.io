<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>专业级路由器压力测试 - 高并发网络吞吐压测工具</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fira+Mono&display=swap');
  html, body, #app {
    margin: 0; padding: 0; height: 100%;
    background: #0a0a0a;
    color: #00ff00;
    font-family: 'Fira Mono', monospace;
    overflow: hidden;
  }
  #app {
    display: flex;
    flex-direction: column;
  }
  header {
    background: #011400;
    padding: 1rem 2rem;
    font-size: 1.5rem;
    border-bottom: 2px solid #003300;

    user-select: none;
  }
  main {
    flex: 1;
    display: flex;
    flex-direction: row;
    padding: 1rem 2rem;
    gap: 20px;
    overflow: hidden;
  }
  section.config {
    flex: 0 0 350px;
    background: #001100;
    border: 2px solid #004400;

    flex-direction: column;

  button {

  .stat-value {
    font-weight: 700;

  section.log-section {
    margin-top: 1rem;

  section.log-section h3 {

  .log-window {
    flex: 1;
    padding: 0.5rem 1rem;

  }
  .log-entry {
    margin-bottom: 2px;
    font-family: 'Fira Mono', monospace;
  }
  .log-error {
    color: #ff4422;
  }
  .log-warn {
    color: #ffaa22;
  }

  .log-debug {

  .loading-spinner {
    margin-left: 10px;
    width: 18px;

    border: 2px solid #00ff0055;

  footer {
    background: #011400;

  }
  .button-row {
    margin-top: auto;

    gap: 1rem;
  }
  .concurrency-controls {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }
  .footer-link {
    color: #006600;

    cursor: pointer;
  }
  .footer-link:hover {
    color: #00bb00;
  }
</style>
</head>
<body>
<div id="app" role="main" aria-label="路由器压力测试工具 - 高并发网络带宽压测">
  <header>
    路由器压力测试工具 Professional Router Stress Tester
  </header>
  <main>
    <section class="config" aria-label="配置面板">
      <h2>压力测试配置</h2>

      <label for="target-url">
        测试目标URL (测试文件请求地址 / 可替换自建文件URL)
        <input type="text" id="target-url" placeholder="http://example.com/testfile.bin" spellcheck="false" autocomplete="off"
          value="https://speed.hetzner.de/100MB.bin" />
      </label>

      <label for="concurrency">
        并发下载连接数 (Concurrency)
        <input type="number" id="concurrency" min="1" max="500" value="50" />
      </label>

      <label for="thread-count">
        线程数 (每线程并发数的批量控制, 最大线程数 20)
        <input type="number" id="thread-count" min="1" max="20" value="5" />
      </label>

      <label for="file-size-mb">
        测试文件大小 (MB，单次请求文件大小，建议1~10MB)
        <input type="number" id="file-size-mb" min="0.1" max="50" step="0.1" value="5" />
      </label>

      <label for="chunk-size-kb">
        请求区块大小 (KB，HTTP Range 单次请求字节数, 协议支持 Range 请求)
        <input type="number" id="chunk-size-kb" min="16" max="1024" step="16" value="512" />
      </label>

      <div class="button-row" role="group" aria-label="测试进度控制按钮">
        <button id="start-btn" title="开始压力测试">开始</button>
        <button id="pause-btn" title="暂停当前压力测试" disabled>暂停</button>
        <button id="resume-btn" title="继续压力测试" disabled>继续</button>
        <button id="stop-btn" title="停止压力测试" disabled>停止</button>
      </div>

      <div style="margin-top: 12px; font-size: 0.8rem; color: #008800;">
        <div>注：确保目标URL支持HTTP Range请求，且允许足够多并发连接。</div>
        <div>强制刷新DNS和路由器配置以获得更真实负载效果。</div>
      </div>
    </section>

    <section class="stats" aria-label="压力测试统计信息">
      <h2>实时统计数据</h2>
      <div class="stats-grid">
        <div class="stat-item" aria-live="polite" aria-atomic="true" aria-label="当前下载速度">
          <div class="stat-label">下载速度</div>
          <div class="stat-value" id="speed-display">0 Mbps</div>
        </div>
        <div class="stat-item" aria-live="polite" aria-atomic="true" aria-label="当前活动连接数">
          <div class="stat-label">活动连接数</div>
          <div class="stat-value" id="connection-count">0</div>
        </div>
        <div class="stat-item" aria-live="polite" aria-atomic="true" aria-label="累计下载流量">
          <div class="stat-label">累计下载流量</div>
          <div class="stat-value" id="total-bytes">0 MB</div>
        </div>
        <div class="stat-item" aria-live="polite" aria-atomic="true" aria-label="压力测试运行时间">
          <div class="stat-label">运行时间</div>
          <div class="stat-value" id="runtime">00:00:00</div>
        </div>
        <div class="stat-item" aria-live="polite" aria-atomic="true" aria-label="请求成功次数">
          <div class="stat-label">成功请求</div>
          <div class="stat-value" id="success-count">0</div>
        </div>
        <div class="stat-item" aria-live="polite" aria-atomic="true" aria-label="请求失败次数">
          <div class="stat-label">失败请求</div>
          <div class="stat-value" id="failure-count">0</div>
        </div>
      </div>

      <section class="log-section" aria-label="压力测试日志窗口">
        <h3>日志输出</h3>
        <pre class="log-window" id="log-window" role="log" aria-live="polite" aria-relevant="additions"></pre>
      </section>
    </section>
  </main>

  <footer>
    路由器压力测试工具 &mdash; 专业网络吞吐量测试 &nbsp;|&nbsp;
    <span class="footer-link" tabindex="0" role="button" id="about-link">关于本工具</span>
  </footer>
</div>

<script>
/**
 * 专业级路由器压力测试工具
 * 要求:
 * - 超高并发下载跑满1000Mbps~2.5Gbps
 * - 无限循环不保存，仅做流量测试
 * - 支持自定义并发数、文件大小、线程数
 * - 实时显示速度、连接数、已下载流量、运行时间
 * - 可开始、暂停、继续、停止
 * - 专业控制台黑绿主题
 * - 大量错误处理、状态监控、日志滚动、加载动画
 * - 模块化结构、类、异步控制、批量请求池
 * - 最大化打满路由器NAT表和CPU负载
 */

(() => {
  "use strict";

  // ---------- 辅助函数 ----------
  const $ = selector => document.querySelector(selector);
  const formatBytes = bytes => {
    if (bytes < 1024) return bytes + " B";
    if (bytes < 1048576) return (bytes / 1024).toFixed(1) + " KB";
    if (bytes < 1073741824) return (bytes / 1048576).toFixed(2) + " MB";
    return (bytes / 1073741824).toFixed(3) + " GB";
  };
  const formatSpeedMbps = bytesPerSec => ((bytesPerSec * 8) / 1e6).toFixed(2) + " Mbps";
  const formatDuration = seconds => {
    const h = Math.floor(seconds / 3600).toString().padStart(2, "0");
    const m = Math.floor((seconds % 3600) / 60).toString().padStart(2, "0");
    const s = Math.floor(seconds % 60).toString().padStart(2, "0");
    return `${h}:${m}:${s}`;
  };
  const sleep = ms => new Promise(r => setTimeout(r, ms));

  // ---------- 日志模块 ----------
  class Logger {
    constructor(logElement) {
      this.logElement = logElement;
      this.maxEntries = 1000;
      this.entries = [];
      this.lockScroll = false;
      this.initUserScrollControl();
    }
    initUserScrollControl() {
      const el = this.logElement;
      el.addEventListener("scroll", () => {
        // User scrolls away from bottom -> lock autoscroll
        const atBottom = el.scrollHeight - el.scrollTop <= el.clientHeight + 5;
        this.lockScroll = !atBottom;
      });
    }
    log(message, level = "info") {
      const timestamp = new Date().toISOString().slice(11, 23);
      const entry = { timestamp, message, level };
      this.entries.push(entry);
      if (this.entries.length > this.maxEntries) this.entries.shift();
      this.render();
    }
    debug(msg) { this.log(msg, "debug"); }
    info(msg) { this.log(msg, "info"); }
    warn(msg) { this.log(msg, "warn"); }
    error(msg) { this.log(msg, "error"); }
    clear() {
      this.entries = [];
      this.render();
    }
    render() {
      if (!this.logElement) return;
      this.logElement.innerHTML = this.entries.map(
        e => `<div class="log-entry log-${e.level}">[${e.timestamp}] ${e.message}</div>`
      ).join("\n");
      if (!this.lockScroll) {
        this.logElement.scrollTop = this.logElement.scrollHeight;
      }
    }
  }

  // ---------- 请求器（单个HTTP Range请求） ----------
  class ChunkFetcher {
    constructor(targetUrl, byteRangeStart, byteRangeEnd, signal) {
      this.url = targetUrl;
      this.rangeStart = byteRangeStart;
      this.rangeEnd = byteRangeEnd;
      this.signal = signal;
    }
    async fetch() {
      const headers = new Headers();
      headers.append("Range", `bytes=${this.rangeStart}-${this.rangeEnd}`);
      try {
        const response = await fetch(this.url, { headers, signal: this.signal, cache: "no-store" });
        if (response.status !== 206 && response.status !== 200) {
          throw new Error(`HTTP状态错误: ${response.status} ${response.statusText}`);
        }
        // 读取响应体，全部丢弃，仅测流量
        const reader = response.body.getReader();
        let receivedLength = 0;
        while(true) {
          const {done, value} = await reader.read();
          if(done) break;
          receivedLength += value.length;
          // 这里可考虑上报流量进度，但为了性能可简单处理
        }
        return receivedLength;
      } catch (err) {
        if (this.signal.aborted) throw new DOMException('Aborted','AbortError');
        throw err;
      }
    }
  }

  // ---------- 请求线程 (管理对同一资源的批量请求) ----------
  class FetchThread {
    constructor(id, targetUrl, fileSizeBytes, chunkSizeBytes, concurrencyPerThread, logger) {
      this.id = id;
      this.url = targetUrl;
      this.fileSize = fileSizeBytes;
      this.chunkSize = chunkSizeBytes;
      this.concurrency = concurrencyPerThread;
      this.logger = logger;

      this.abortController = null;
      this.activeFetches = new Set();
      this.running = false;

      this.totalFetched = 0;
      this.successCount = 0;
      this.failureCount = 0;
    }

    start() {
      if (this.running) return;
      this.abortController = new AbortController();
      this.running = true;
      this._loop();
    }

    async _loop() {
      try {
        while(this.running) {
          // 保证并发数
          while(this.activeFetches.size < this.concurrency) {
            if (!this.running) break;
            const rangeStart = this._randomRangeStart();
            const rangeEnd = Math.min(rangeStart + this.chunkSize - 1, this.fileSize - 1);

            const fetcher = new ChunkFetcher(this.url, rangeStart, rangeEnd, this.abortController.signal);
            const p = fetcher.fetch()
              .then(size => {
                this.totalFetched += size;
                this.successCount++;
                this.activeFetches.delete(p);
              })
              .catch(err => {
                if (err.name === "AbortError") {
                  this.logger.debug(`[线程${this.id}] 请求中止: ${err.message}`);
                } else {
                  this.failureCount++;
                  this.logger.warn(`[线程${this.id}] 请求错误: ${err.message}`);
                }
                this.activeFetches.delete(p);
              });
            this.activeFetches.add(p);
          }
          // 清理完毕的请求等待
          if (this.activeFetches.size >= this.concurrency) {
            await Promise.race(this.activeFetches);
          } else {
            await sleep(10);
          }
        }
      } catch (err) {
        this.logger.error(`[线程${this.id}] 异常: ${err.message}`);
      } finally {
        this.running = false;
        this.abortController = null;
        this.activeFetches.clear();
        this.logger.info(`[线程${this.id}] 已停止`);
      }
    }

    _randomRangeStart() {
      // 生成随机区块的起始偏移，适应文件大小
      return Math.floor(Math.random() * (this.fileSize - this.chunkSize));
    }

    stop() {
      this.running = false;
      if (this.abortController) {
        this.abortController.abort();
      }
    }

    pause() {
      this.stop();
    }

    resume() {
      if (!this.running) {
        this.start();
      }
    }
  }

  // ---------- 线程池管理器（多线程并发控制） ----------
  class ThreadPool {
    constructor(targetUrl, fileSizeBytes, chunkSizeBytes, totalConcurrency, threadCount, logger) {
      this.url = targetUrl;
      this.fileSize = fileSizeBytes;
      this.chunkSize = chunkSizeBytes;
      this.totalConcurrency = totalConcurrency;
      this.threadCount = threadCount;
      this.logger = logger;

      this.threads = [];
      this.running = false;

      this.totalFetched = 0;
      this.successCount = 0;
      this.failureCount = 0;
    }

    start() {
      if (this.running) return;
      this.running = true;
      this._initThreads();
      this.threads.forEach(thread => thread.start());
      this._statisticsLoop();
      this.logger.info(`启动线程池: 线程数=${this.threadCount}, 总并发=${this.totalConcurrency}`);
    }

    _initThreads() {
      this.stop(); // 停止旧线程
      this.threads = [];
      const concurrencyPerThread = Math.floor(this.totalConcurrency / this.threadCount);
      const remainder = this.totalConcurrency % this.threadCount;
      for (let i = 0; i < this.threadCount; i++) {
        let cpt = concurrencyPerThread + (i === 0 ? remainder : 0);
        const t = new FetchThread(i + 1, this.url, this.fileSize, this.chunkSize, cpt, this.logger);
        this.threads.push(t);
      }
      this.totalFetched = 0;
      this.successCount = 0;
      this.failureCount = 0;
    }

    async _statisticsLoop() {
      while(this.running) {
        this.totalFetched = 0;
        this.successCount = 0;
        this.failureCount = 0;
        let runningThreads = 0;
        for (const t of this.threads) {
          this.totalFetched += t.totalFetched;
          this.successCount += t.successCount;
          this.failureCount += t.failureCount;
          if (t.running) runningThreads++;
        }
        this.activeConnections = this.threads.reduce((acc, t) => acc + t.activeFetches.size, 0);
        app.updateStatus({
          totalFetched: this.totalFetched,
          successCount: this.successCount,
          failureCount: this.failureCount,
          activeConnections: this.activeConnections,
          runningThreads,
        });
        await sleep(500);
      }
    }

    pause() {
      if (!this.running) return;
      this.threads.forEach(t => t.pause());
      this.running = false;
      this.logger.info("线程池：所有线程暂停");
    }

    resume() {
      if (this.running) return;
      this.running = true;
      this.threads.forEach(t => t.resume());
      this._statisticsLoop();
      this.logger.info("线程池：所有线程恢复");
    }

    stop() {
      this.running = false;
      this.threads.forEach(t => t.stop());
      this.logger.info("线程池：所有线程已停止");
    }
  }

  // ---------- 主应用 ----------
  class App {
    constructor() {
      // 选取元素
      this.dom = {
        targetUrl: $("#target-url"),
        concurrency: $("#concurrency"),
        threadCount: $("#thread-count"),
        fileSizeMB: $("#file-size-mb"),
        chunkSizeKB: $("#chunk-size-kb"),
        startBtn: $("#start-btn"),
        pauseBtn: $("#pause-btn"),
        resumeBtn: $("#resume-btn"),
        stopBtn: $("#stop-btn"),
        speedDisplay: $("#speed-display"),
        connectionCount: $("#connection-count"),
        totalBytes: $("#total-bytes"),
        runtime: $("#runtime"),
        successCount: $("#success-count"),
        failureCount: $("#failure-count"),
        logWindow: $("#log-window"),
        aboutLink: $("#about-link"),
      };

      this.logger = new Logger(this.dom.logWindow);

      // 控制状态
      this.threadPool = null;
      this.startTime = null;
      this.timerId = null;
      this.running = false;
      this.paused = false;

      // 绑定事件
      this.dom.startBtn.addEventListener("click", () => this.startTest());
      this.dom.pauseBtn.addEventListener("click", () => this.pauseTest());
      this.dom.resumeBtn.addEventListener("click", () => this.resumeTest());
      this.dom.stopBtn.addEventListener("click", () => this.stopTest());
      this.dom.aboutLink.addEventListener("click", () => this.showAbout());

      // UI 初始化
      this.updateButtons();
      this.updateStatus({
        totalFetched: 0,
        activeConnections: 0,
        successCount: 0,
        failureCount: 0,
        runningThreads: 0,
      });
    }

    validateInputs() {
      const url = this.dom.targetUrl.value.trim();
      if (!url) {
        alert("请输入有效的测试目标URL。");
        return null;
      }
      try {
        new URL(url);
      } catch(e) {
        alert("测试目标URL格式不正确。");
        return null;
      }
      const concurrency = parseInt(this.dom.concurrency.value, 10);
      const threadCount = parseInt(this.dom.threadCount.value, 10);
      const fileSizeMB = parseFloat(this.dom.fileSizeMB.value);
      const chunkSizeKB = parseInt(this.dom.chunkSizeKB.value, 10);

      if (
        isNaN(concurrency) || concurrency < 1 || concurrency > 500 ||
        isNaN(threadCount) || threadCount < 1 || threadCount > 20 ||
        isNaN(fileSizeMB) || fileSizeMB <= 0 || fileSizeMB > 50 ||
        isNaN(chunkSizeKB) || chunkSizeKB < 16 || chunkSizeKB > 1024
      ) {
        alert("请确保所有数值输入均在有效范围内。");
        return null;
      }
      if (chunkSizeKB * 1024 > fileSizeMB * 1024*1024) {
        alert("区块大小不能大于单次请求文件大小。");
        return null;
      }

      if (concurrency < threadCount) {
        alert("并发连接数应大于等于线程数。");
        return null;
      }
      return { url, concurrency, threadCount, fileSizeMB, chunkSizeKB };
    }

    startTest() {
      if (this.running) return;
      const config = this.validateInputs();
      if (!config) return;

      this.logger.clear();
      this.logger.info("开始压力测试...");
      this.startTime = Date.now();

      const fileSizeBytes = Math.ceil(config.fileSizeMB * 1024 * 1024);
      const chunkSizeBytes = Math.ceil(config.chunkSizeKB * 1024);

      this.threadPool = new ThreadPool(config.url, fileSizeBytes, chunkSizeBytes,
        config.concurrency, config.threadCount, this.logger);

      this.threadPool.start();

      this.running = true;
      this.paused = false;
      this.updateButtons();

      this._runtimeLoop();
    }

    _runtimeLoop() {
      if (!this.running) {
        this.updateStatus({ runningThreads: 0 });
        return;
      }
      let seconds = Math.floor((Date.now() - this.startTime) / 1000);
      this.dom.runtime.textContent = formatDuration(seconds);
      this.timerId = setTimeout(() => this._runtimeLoop(), 1000);
    }

    pauseTest() {
      if (!this.running || this.paused) return;
      this.threadPool.pause();
      this.paused = true;
      this.updateButtons();
      this.logger.info("压力测试已暂停");
    }

    resumeTest() {
      if (!this.running || !this.paused) return;
      this.threadPool.resume();
      this.paused = false;
      this.updateButtons();
      this.logger.info("压力测试已继续");
    }

    stopTest() {
      if (!this.running) return;
      this.threadPool.stop();
      this.running = false;
      this.paused = false;
      clearTimeout(this.timerId);
      this.dom.runtime.textContent = "00:00:00";
      this.updateButtons();
      this.logger.info("压力测试已停止");
      this.updateStatus({
        totalFetched: 0,
        activeConnections: 0,
        successCount: 0,
        failureCount: 0,
        runningThreads: 0,
      });
    }

    updateStatus({ totalFetched, activeConnections, successCount, failureCount, runningThreads }) {
      this.dom.totalBytes.textContent = formatBytes(totalFetched || 0);
      this.dom.successCount.textContent = (successCount || 0).toString();
      this.dom.failureCount.textContent = (failureCount || 0).toString();
      this.dom.connectionCount.textContent = (activeConnections || 0).toString();

      // 计算速度 — bytes/s (估算最近一段时间请求体大小/间隔)
      // 近似计算，速度 = newly fetched / 0.5秒
      if (this._lastTotalFetched === undefined) {
        this._lastTotalFetched = 0;
        this._lastSpeedMeasurement = Date.now();
        this.dom.speedDisplay.textContent = "0 Mbps";
      } else {
        const now = Date.now();
        const dt = (now - this._lastSpeedMeasurement) / 1000;
        if (dt > 0.3) {
          const delta = totalFetched - this._lastTotalFetched;
          const speed = delta / dt;
          this.dom.speedDisplay.textContent = formatSpeedMbps(speed);
          this._lastTotalFetched = totalFetched;
          this._lastSpeedMeasurement = now;
        }
      }
    }

    updateButtons() {
      this.dom.startBtn.disabled = this.running;
      this.dom.pauseBtn.disabled = !this.running || this.paused;
      this.dom.resumeBtn.disabled = !this.running || !this.paused;
      this.dom.stopBtn.disabled = !this.running;
      this.dom.targetUrl.disabled = this.running;
      this.dom.concurrency.disabled = this.running;
      this.dom.threadCount.disabled = this.running;
      this.dom.fileSizeMB.disabled = this.running;
      this.dom.chunkSizeKB.disabled = this.running;
    }

    showAbout() {
      alert(`专业级路由器压力测试工具
版本: 1.0
作者: OpenAI GPT-4.1

功能:
- 超高并发HTTP Range请求模拟下载，最大化打满路由器NAT及CPU负载；
- 无限循环压力测试，支持自定义并发数、请求文件大小、线程数；
- 实时速度、连接数、流量、运行时间监控；
- 支持开始、暂停、继续与停止；
- 黑绿专业控制台UI，详细日志滚动显示；
- 设计目标为极限压力测试路由器下行通道与处理能力。

注意事项:
- 请选择支持Range请求的测试文件URL；
- 需考虑路由器与被测服务器带宽能力和资源限制；
- 请勿用于未经授权的网络和设备。

感谢使用！`);
    }
  }

  // ---------- 启动应用 ----------
  const app = new App();

  // 对外暴露app方便调试 (可注释)
  window.App = app;

})();
</script>
