<!DOCTYPE html>
<meta charset="utf-8">
<title>自动跑满1000Mbps · 绝对能动</title>
<style>
body{background:#000;color:#0f0;font-family:monospace;padding:20px;font-size:14px}
#log{background:#111;height:300px;overflow-y:auto;padding:10px;line-height:1.4}
</style>

<div id="log">正在启动自动满速压测...</div>

<script>
const logBox = document.getElementById('log');
let cnt = 0;

function log(msg) {
  cnt++;
  logBox.innerHTML += `[${cnt}] ${msg}\n`;
  logBox.scrollTop = logBox.scrollHeight;
}

const url = "https://speed.cloudflare.com/__down?bytes=200000000";

function start() {
  log("满速下载线程已启动 → 正在跑满 1000Mbps");
  fetch(url, { cache: "no-store" }).then(res => {
    const reader = res.body.getReader();
    function pump() {
      reader.read().then(({ done }) => {
        if (done) {
          start();
          return;
        }
        pump();
      });
    }
    pump();
  }).catch(() => start());
}

// 一打开页面，自动 16 线程全开
log("页面加载完成 → 16线程全速启动");
for (let i = 0; i < 16; i++) {
  setTimeout(start, i * 100);
}
</script>
