<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>暴力压测 · 必卡死路由</title>
<style>
body{background:#000;color:#0f0; font-family: monospace; padding: 20px;}
#log{background:#111; height:300px; overflow-y:scroll; padding:10px; border:1px solid #080; margin:10px 0;}
button{padding:10px 20px; font-size:16px; margin:5px;}
#start{background:#a00; color:#fff;}
#stop{background:#080; color:#fff;}
</style>
</head>
<body>

<h2>⚠️ 路由器暴力压测（必出效果）</h2>
<p>点开始后日志会疯狂刷屏，网络立刻占满</p>

<button id="start">开始压测</button>
<button id="stop">停止</button>
<div id="log"></div>

<script>
let stopped = false;
let count = 0;
const log = document.getElementById('log');

function show(text) {
  count++;
  log.innerHTML += `[${count}] ${text}\n`;
  log.scrollTop = log.scrollHeight;
}

async function attack() {
  if (stopped) return;
  try {
    let controller = new AbortController();
    fetch('https://speed.cloudflare.com/__down?bytes=5000000', {
      signal: controller.signal,
      cache: 'no-store'
    }).then(res => {
      if (res.body) {
        let reader = res.body.getReader();
        function pump() {
          if (stopped) { controller.abort(); return; }
          reader.read().then(v => {
            if (!v.done) pump();
          });
        }
        pump();
      }
    }).catch(()=>{});
  } catch(e) {}
}

document.getElementById('start').onclick = () => {
  stopped = false;
  show('压测开始 → 即将打爆路由器');
  // 一次性开 600 个请求，浏览器直接火力拉满
  for(let i=0; i<600; i++) {
    setTimeout(() => {
      attack();
      attack();
    }, i*4);
  }
};

document.getElementById('stop').onclick = () => {
  stopped = true;
  show('压测停止');
};
</script>
</body>
</html>
