<!DOCTYPE html>
<meta charset="utf-8">
<title>路由死机级压测</title>
<style>
body{background:#000;color:#ff4444;padding:20px;font-family: monospace}
.warn{background:#300;color:#ff0;padding:10px;border-radius:6px}
#log{background:#111;color:#0f0;height:300px;overflow-y:auto;padding:10px;margin-top:10px}
button{padding:12px 24px;font-size:16px;margin:5px}
#start{background:#a00;color:#fff}
#stop{background:#0a0;color:#fff}
</style>

<div class="warn">
⚠️ 此页面会创建数千并发请求，打爆路由NAT表、CPU 100%<br>
⚠️ 目标：直接让路由器死机、卡死、无响应<br>
⚠️ 运行时间建议不超过 10~20 秒！
</div>

<button id="start">启动 → 弄死路由</button>
<button id="stop">紧急停止</button>
<div id="log"></div>

<script>
const log = (m) => {
  let t = new Date().toLocaleTimeString();
  logEl.innerHTML += `[${t}] ${m}\n`;
  logEl.scrollTop = logEl.scrollHeight;
};

let running = true;
let signals = [];

function fire() {
  if (!running) return;

  const ac = new AbortController();
  signals.push(ac);

  fetch("https://speed.cloudflare.com/__down?bytes=1000000", {
    signal: ac.signal,
    mode: 'no-cors',
    cache: 'no-store',
    priority: 'high',
    keepalive: true
  }).then(() => {}).catch(() => {}).finally(() => {
    fire(); // 无限递归发起请求
  });
}

start.onclick = () => {
  running = true;
  log("启动暴力并发压测 —— 路由即将卡死");
  log("目标：NAT表爆满、CPU 100%、死机");

  // 一次性启动 800 个请求链，直接打爆路由
  for (let i = 0; i < 800; i++) {
    setTimeout(fire, i * 2);
  }
};

stop.onclick = () => {
  running = false;
  signals.forEach(s => s.abort());
  signals = [];
  log("已停止所有请求");
};
</script>
